<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found | ToolHub</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="description" content="This ToolHub page could not be found. Return to the directory to browse available tools." />
  <meta name="theme-color" content="#070b14" />
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070b14;color:#eff4fc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,560px);border:1px solid #263751;border-radius:24px;background:#111b29;padding:clamp(28px,6vw,48px);text-align:center;box-shadow:0 24px 70px #0005}
    .code{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8db7ff}
    h1{font-size:clamp(28px,5vw,38px);line-height:1.1;letter-spacing:-.04em;margin:12px 0}
    p{color:#aab7c9;line-height:1.7;font-size:14px;margin:0 auto;max-width:410px}
    a{display:inline-flex;align-items:center;justify-content:center;margin-top:26px;min-height:44px;border-radius:12px;background:#2d6cdf;color:white;text-decoration:none;font-weight:800;font-size:14px;padding:0 20px}
    a:hover{background:#2258ba}a:focus-visible{outline:3px solid #8db7ff;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="code">Error 404</div>
    <h1>We couldn’t find that page</h1>
    <p>The link may be outdated, or the address may be incorrect. Head back to ToolHub to browse the calculators and utilities that are available now.</p>
    <a href="/">Browse all tools</a>
  </main>
</body>
</html>
